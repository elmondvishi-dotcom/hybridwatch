events:
  min_posts: 3                  # a narrative needs this many posts...
  min_share: 0.25               # ...and this share of them must use the category's words
  merge_hours: 12               # narratives of one category, same place, starting within this window = one event
  recompute_seconds: 20         # events are recomputed at most this often (wall time)

# Sensitive targets, weighted 1-5 (5 = most critical). Matched in posts in all three languages and both scripts.
# A hostile signal against a target of weight 1-2 can never be more than "Watch".
sensitive_targets:
  - {name: KFOR, weight: 5, stems: [kfor, кфор]}
  - {name: EULEX, weight: 5, stems: [eulex, еулекс]}
  - {name: Elections, weight: 5, stems: [zgjedhj, izbor, избор, election, votim, glasanj, гласањ]}
  - {name: Power grid (KEK, KOSTT), weight: 5, stems: [kek$, kostt, keds, grid, rrjet elektrik, elektro mrez, rrym, struj,
                                                  струј, electricity, power cut, power outage, blackout]}
  - {name: Water supply, weight: 5, stems: [uje$, ujit, ujin, ujesjell, voda$, vodu$, vode$, вода, vodovod, water supply,
                                           tap water, drinking water, rubinet]}
  - {name: Border crossings, weight: 5, stems: [jarinj, јарињ, merdar, мердар, bernjak, brnjak, pikekalim, prelaz, прелаз,
                                                border crossing]}
  - {name: Government portals, weight: 5, stems: [ekosova, rks gov, government portal, portali shteteror, drzavni portal]}
  - {name: Police, weight: 5, stems: [polici, policij, полициј, police]}
  - {name: Banks, weight: 4, stems: [bank, банк]}
  - {name: Telecom, weight: 4, stems: [telekom, telecom, ipko, vala$, internet]}
  - {name: Hospitals, weight: 4, stems: [spital, bolnic, болниц, hospital$, hospitals$, qkuk]}
  - {name: Airport, weight: 4, stems: [aeroport, aerodrom, аеродром, airport]}
  - {name: Ibar bridge / Mitrovica, weight: 4, stems: [ura e ibrit, ibarski most, ibar bridge, mitrovic, митровиц]}
  - {name: Inter-community relations, weight: 4, stems: [nderetnik, medjuetnick, међуетнич, interethnic, inter ethnic]}
  - {name: Army / military, weight: 4, stems: [ushtri, vojsk, војск, army, military, troops]}
  - {name: Municipalities, weight: 3, stems: [komun, opstin, општин, municipal]}
  - {name: Schools, weight: 3, stems: [shkoll, skol, школ, school]}
  - {name: Media, weight: 3, stems: [gazetar, novinar, новинар, journalist]}
  - {name: Roads / transport, weight: 2, stems: [rrug, autostrad, puteve, putevi, road, highway]}
  - {name: Prices / economy, weight: 1, stems: [cmim, cena, цена, price, fatur, racun, bill$, bills$]}

# ---------------- seeded into the database on first run ----------------
sources:
  - {name: "Demo replay dataset", type: replay, url: "data/demo_posts.jsonl", credibility: mixed, enabled: true}
  # Add real RSS feeds of regional outlets here or in the UI. Credibility is used by the
  # "no credible outlet reported it first" signal: credible | unknown | low
  - {name: "Example regional outlet (add RSS URL)", type: rss, url: "", credibility: credible, enabled: false}

focus:
  keywords: [mitrovica, kfor, election, energy, water, border]
  regions: ["Kosovo", "Serbia", "Albania", "North Macedonia", "Bosnia and Herzegovina", "Montenegro"]

factcheckers:
  - {name: "Demo fact-check library (synthetic)", type: file, url: "data/factchecks_demo.json", enabled: true}
  # Regional fact-checkers. Add each one's RSS feed URL (check their site) and enable.
  - {name: "Hibrid.info (Kosovo)", type: rss, url: "", enabled: false}
  - {name: "Krypometri / Kallxo (Kosovo)", type: rss, url: "", enabled: false}
  - {name: "Raskrikavanje (Serbia)", type: rss, url: "", enabled: false}
  - {name: "Faktoje (Albania)", type: rss, url: "", enabled: false}
  - {name: "EUvsDisinfo", type: rss, url: "", enabled: false}
  # Needs a free API key in env var GOOGLE_FACTCHECK_KEY; url = search query
  - {name: "Google Fact Check Tools", type: google_factcheck, url: "Kosovo", enabled: false}

# Regional glossary: word stems (any language/script) -> shared concept.
# Lets Albanian, Serbian and English posts about the same story group together.
glossary:
  water: [uje, ujit, ujin, ujerat, ujesjell, voda, vodu, vode, vodi, vodovod, water, tap]
  poison: [helm, kontamin, ndot, otrov, zatrov, zagadj, kontaminir, poison, contamin, toxic]
  kfor: [kfor]
  withdraw: [terhiq, terheq, largohe, povuc, povlac, povlaci, napust, withdraw, leaving, pullout, pull]
  euro: [euro, evro, eur]
  bank: [bank, banka, banke, bankat, bankave]
  freeze: [ngri, zamrz, freez]
  power: [rrym, energji, kek, struj, elektr, power, electric, blackout, outage, nestan]
  sabotage: [sabot, diversi, sabotaz, attack, sulm, napad]
  snow: [bor, debor, sneg, snow, snijeg]
  road: [rrug, autostrad, put, puteve, putevi, road, highway, magistral]
  closed: [mbyll, zatvor, closed, bllok, blokir, block]
  price: [cmim, shtrenjt, cena, cene, poskup, price, cost, tarif]
  football: [futboll, ndeshj, fudbal, utakmic, football, match, gol, goal, stadi, kombetar, reprezent, gjyqtar, sudij, referee, fitore, pobed, humbj, poraz]
  election: [zgjedhj, izbor, election, vote, vot, glas]
  mitrovica: [mitrovic]
  pristina: [prishtin, pristin, pristina]
  belgrade: [beograd, belgrade]
  border: [kufi, granic, border, crossing, jarinj, merdar]
