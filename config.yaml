# HybridWatch configuration
# Model/threshold settings live here. Sources, focus and fact-checkers are copied into the
# database on first run and are then edited from the Settings page in the UI.

db_path: data/hybridwatch.db

# "hashing" = offline, fast, no download (default)
# "sentence-transformers" = multilingual neural model (pip install sentence-transformers)
embedder: hashing
embedder_model: paraphrase-multilingual-MiniLM-L12-v2

# LLM is optional. Used only for: narrative labels, translations, debunk-match confirmation.
# provider: none | anthropic | openai_compatible
#   openai_compatible works with a locally hosted open-weight model (e.g. Mistral via Ollama:
#   base_url http://localhost:11434/v1, model mistral) -> no data leaves your machine.
llm:
  provider: none
  model: claude-haiku-5-5
  base_url: http://localhost:11434/v1
  api_key_env: ANTHROPIC_API_KEY

worker:
  poll_seconds: 2          # how often the worker checks sources
  batch_size: 500          # max posts processed per cycle

replay:
  file: data/demo_posts.jsonl
  speed: 400               # simulated seconds per real second (48h of data ~ 7 min)

# Cyber module: every cyber event is a claim until checks support or contradict it (hybridwatch/verify.py)
cyber:
  live_checks: false            # true = homepage GET, IODA and CISA KEV lookups. Off for the demo (no network calls)
  recheck_minutes: 30           # re-check unverified / partly confirmed claims this often...
  recheck_hours: 48             # ...for this long after they were first seen
  http_timeout: 10
  availability_min_interval_minutes: 10   # at most one GET per host in this interval. A single GET, never a scan
  ioda_api: https://api.ioda.inetintel.cc.gatech.edu/v2
  kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  watch_products: [fortinet, fortios, ivanti, citrix, netscaler, microsoft exchange, sharepoint, cisco, palo alto, moveit, vmware]
  kosovo_domains: [.rks-gov.net, .xk, .gov.rks]
  kosovo_terms: [kosovo, kosova, kosove, prishtin, pristin, mitrovic, prizren, peja, gjakov, ferizaj, gjilan]
  # cyber sources: seeded into the database on first run, then edited in Settings (hybridwatch/cyber_collectors.py)
  # Live sources are off: enable them in Settings. Public data only; one GET per poll; leak-site links are dropped.
  sources:
    - {name: "Demo cyber scenario (synthetic)", type: replay, url: "data/demo_cyber.json", enabled: true}
    - {name: "Ransomware.live: victims in Kosovo", type: ransomware_live, url: "XK", enabled: false}      # or "search:kosovo"
    - {name: "Ransomware.live: keyword kosovo", type: ransomware_live, url: "search:kosovo", enabled: false}
    - {name: "IODA: internet outages in Kosovo", type: ioda, url: "country:XK", enabled: false}          # add "asn:<n>" entries
    - {name: "CISA KEV: watched products", type: kev, url: "", enabled: false}
    - {name: "KOS-CERT announcements", type: cert_rss, url: "", enabled: false}                         # set the RSS / page URL
    - {name: "GovCERT XK announcements", type: cert_rss, url: "", enabled: false}
    - {name: "Telegram channel (hacktivist claims)", type: telegram, url: "", enabled: false}            # channel name
  ransomware_live_api: https://api.ransomware.live/v2
  lookback_days: 30             # ransomware listings older than this are not imported
  kev_lookback_days: 14         # KEV entries added in the last N days
  # hybrid linking (hybridwatch/hybrid.py): cyber event <-> disinformation alert
  link_window_hours: 24         # narrative must be active within this window after the event
  link_min_score: 0.5
  link_min_posts: 5

thresholds:
  cluster_similarity: 0.30     # cosine similarity to join an existing narrative
  merge_similarity: 0.45       # periodic merge of narratives that drifted together
  min_narrative_size: 8        # narratives smaller than this never alert
  dup_jaccard: 0.6             # MinHash similarity that counts as copy-paste
  dup_min_tokens: 10           # shorter posts are never treated as copy-paste
  coord_min_accounts: 5        # distinct accounts posting near-identical text...
  coord_window_minutes: 30     # ...within this window => coordination signal
  new_account_days: 30
  trend_window_minutes: 60
  trend_baseline_hours: 6
  trend_min_posts: 15
  trend_growth: 3.0            # posts in window vs baseline hourly rate
  trend_lookback_hours: 6      # check for spikes at every moment in this window
  debunk_similarity: 0.40
  debunk_min_posts: 3
  bump_growth: 2.0             # an alert is re-surfaced when its post count doubles
  dismissal_expiry_hours: 72   # extra caution after a dismissal fades after this
  lsh_window_hours: 24

# ---------------- what is a threat (hybridwatch/threat.py) ----------------
# A case becomes a threat only if it touches something SENSITIVE (a weighted target below) AND shows a
# HOSTILE, organised or damaging signal. A sensitive topic without a hostile signal is information; a
# hostile-looking signal about something unimportant is noise. We track behaviour, never opinions.
#
# Word stems are normalised (lower case, no diacritics, Cyrillic -> Latin), so a Latin stem also matches the
# Serbian Cyrillic spelling; Cyrillic forms are listed too for readability. A stem matches a word that starts
# with it; a stem ending in '$' must match the whole word; a stem with a space is a phrase.
#   keywords  what the story is about           (needs: it must ALSO mention one of these)
#   hostile   behaviour that makes it hostile    (violence, attack, call to block, ...)
#   benign    the "not a threat" side            (maintenance, weather, peaceful, routine ...)
threat_categories:
  disinformation:
    label: Disinformation
    not_threat: "Criticism of the government, political opinion and isolated errors are not threats."
    keywords: [lajm i rreme, lajme te rreme, dezinform, propagand, lazna vest, lazne vesti, лажна вест, dezinformacij,
               fake news, disinformation, hoax, panik, panic, urgjent, hitno, хитно, shperndaje, podelite, поделите]
    hostile: []          # hostility comes from the signals: coordination, new accounts, debunked claim
    benign: [kritik, kritikuj, criticis, mendim, misljenj, opinion]
  cyber:
    label: Cyber
    not_threat: "Unverified hacker claims are shown as 'Unverified claim'; vulnerabilities in products not used in Kosovo are not threats."
    keywords: [sulm kibernetik, kibernet, sajber, сајбер, cyber, haker, hacker, хакер, hakov, hakuar, ddos, ransomware,
               ransom, rrjedhj, curenj, цурењ, leak, phishing, malware]
    hostile: [ddos, ransomware, hakuar, hakovan, hacked, rrezuam, srusili, oboren, leak, rrjedhj, curenj, deface]
    benign: [trajnim, obuk, training, konferenc, conference, webinar]
  infrastructure:
    label: Infrastructure
    not_threat: "Planned maintenance, small local faults and weather closures are not threats."
    keywords: [nderpre, nderprer, nestan, nestal, prekid, outage, blackout, defekt, kvar, damage, demtim, ostecen, cut$,
               closed, mbyll, zatvor, bllokuar, blokiran, blocked, pa rrym, ra rrym, pa energji, nema struj, без струје,
               bez struj, no power, without power, without electric, went out]
    needs: [rrym, energji, struj, струј, elektr, power, electric, grid, uje, ujit, voda, vodu, vodovod, water, rrug,
            autostrad, puteve, putevi, road, highway, internet, mrez, rrjet, network, telefon, ura$, bridge, aeroport,
            aerodrom, airport, hekurudh, zeleznic, railway, kufi, granic, border]
    hostile: [sabot, diversi, diverzij, sulm, napad, напад, attack, minuar, minira, shperth, eksplod, explos]
    benign: [mirembajt, odrzavanj, одржавањ, maintenance, planned, planifik, planiran, bor$, bora$, debor, sneg, снег,
             snow, snijeg, stuhi, oluj, storm, defekt, kvar, transformer, trafo]
  security_incident:
    label: Security incident
    not_threat: "Ordinary crime without a security dimension (theft, traffic accidents) is not a threat."
    keywords: [shperth, eksplod, експлоз, granat, гранат, bomb, explos, pushk, gjuajt, pucnj, пуцњ, pucal, shoot, gunfire,
               plagos, ranjen, рањен, wounded, vras, ubijen, ubist, killed, kidnap, rrembim, otmic, sulm$, sulmi$, sulmuar,
               napad$, napadnut, attacked, incident ne kufi, incident na granic, border incident, nderetnik, medjuetnick,
               међуетнич, interethnic, inter ethnic]
    hostile: [shperth, eksplod, granat, bomb, explos, pucnj, gjuajt, shoot, gunfire, plagos, ranjen, wounded, vras,
              ubij, killed, kidnap, sulm, napad, attack, mjet shperthyes, eksplozivn]
    benign: [vjedh, kradj, крађ, theft, stolen, aksident trafik, saobracajn nesrec, traffic accident, crash]
  organized_activity:
    label: Organized activity
    not_threat: "Peaceful lawful protests, strikes and political rallies are not threats."
    keywords: [protest, tubim, skup$, okuplj, demonstr, mobiliz, barrikad, barikad, барикад, bllokad, blokad, блокад,
               kontraband, krijumcar, shverc, sverc, шверц, smuggl, rekrut, regrut, recruit, ekstrem, extrem, radikal,
               arrest, uhaps]
    hostile: [barrikad, barikad, bllokad, blokad, dhun, nasilj, насиљ, violence, armatos, naoruz, armed, mobiliz, rekrut,
              regrut, recruit, kontraband, krijumcar, sverc, shverc, smuggl, arme$, armeve, armesh, oruzj, оружј, weapons,
              municion, municij, ammunition]
    benign: [paqesor, mirno, мирно, peaceful, grev, strajk, штрајк, strike, miting, rally]
  regional:
    label: Regional
    not_threat: "Routine diplomacy and ordinary political statements are not threats."
    keywords: [beograd, београд, belgrade, serbi, srbij, србиј, vucic, vuqiq, вучић, tiran, shqiperi, albanij, bruksel,
               brisel, brussels, dialog, dijalog, ushtri, vojsk, војск, army, military, troops, trupa, sanksion, sankcij,
               sanction, ambasad, embassy, vija administrative, administrativn, administrative line]
    hostile: [gatishmeri, gotovost, готовост, readiness, alert$, mobiliz, ushtri, vojsk, army, military, troops, trupa,
              sanksion, sankcij, sanction, kercenim, pretnj, претњ, threat, ultimat, embargo, bllokad, blokad]
    benign: [takim, sastan, meeting, vizit, poset, visit, marreveshj, sporazum, agreement]

# Severity score: five factors, each 1-5; score = weighted sum normalised to 0-100.
threat_scoring:
  weights: {target: 0.25, scale: 0.15, hostility: 0.30, credibility: 0.15, escalation: 0.15}
  levels: {watch: 25, threat: 50, critical: 75}
  min_category_share: 0.2       # share of posts using a category's keywords to put the case in that category
  llm_band: [0.08, 0.2]         # ambiguous share: ask the LLM (if configured) to confirm the category
  llm_budget: 2                 # LLM category checks per worker cycle

# ---------------- events: what happened, where (hybridwatch/events.py) ----------------

